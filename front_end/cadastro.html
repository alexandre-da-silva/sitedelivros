<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar-se</title>
    <link rel="stylesheet" href="CSS/cadastro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

    <div class="cadastro-box">

        <h2>
            <i class="bi bi-person-plus-fill"></i>
            Criar Conta
        </h2>
        
        <p>Email</p>
        <input class="campo" type="email" placeholder="usuario123@email.com">
  
        <p>Senha</p>
        <input class="campo" type="password" placeholder="Digite sua senha">

        <p>Confirmar sua senha</p>
        <input class="campo" type="password" placeholder="Confirme sua senha">

        <br><br>
  
        <button class="botao-cadastrar">
            Cadastrar
        </button>

        <p class="senhas-nao-iguais"></p>

        <br><br>

        <a class = "link-login" href="login.html">
            Já tem uma conta? Faça login
        </a>

    </div>    

    <script src="JS/cadastro.js"></script>
</body>
</html>
