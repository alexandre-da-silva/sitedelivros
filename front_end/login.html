<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Cadastro</title>
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>

    <div class="login-box">

        <h2>
            <i class="bi bi-box-arrow-in-right"></i>
            Entrar
        </h2>
        
        <p>Email</p>
        <input class="campo" type="email" name="email" placeholder="usuario123@email.com">
  
        <p>Senha</p>
        <input class="campo" type="password" name="senha" placeholder="Digite sua senha">

        <br><br>
  
        <button class="botao-login">
            Entrar
        </button>

        <p class="mensagem-erro"></p>

        <br><br>

        <a class = "link-cadastro" href="cadastro.html">
            Não tem uma conta? Cadastra-se
        </a>

    </div>    

    <script src="JS/login.js"></script>
</body>
</html>
